name: Temporary Scraper Run

on:
  workflow_dispatch: # Allows you to manually trigger it with a click

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Enforces Node.js 24 environment execution
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build TypeScript Code
        run: npm run build --if-present

      - name: Start App and Create Serveo Tunnel
        run: |
          echo "🚀 Booting up the scraper in Node $(node -v) background..."
          # Start the app natively (it will bind to port 5000)
          npm start & 
          
          echo "⏳ Waiting 8 seconds for compilation and startup..."
          sleep 8
          
          echo "🔗 Connecting to Serveo to expose port 5000..."
          # Creates a tunnel routing Serveo HTTP traffic straight to internal port 5000
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:5000 serveo.net
