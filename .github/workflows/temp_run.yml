name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Automatically claims a unique subdomain based on a random string if it hasn't been set up yet
          npx wrangler subdomain anivault-api-dev19-${{ github.run_id }} || true
          
          # Runs the deployment smoothly
          npx wrangler deploy src/index.ts --name anivault-api
